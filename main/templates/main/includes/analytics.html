{# Google Analytics 4 (gtag.js). One include per page: templates/base.html and product_detail.html (own <head>). #}
{# Only when DEBUG is False and GA_MEASUREMENT_ID is a valid G-XXXX id (main.context_processors.seo). #}
{% if ANALYTICS_ENABLED and GA_MEASUREMENT_ID %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ GA_MEASUREMENT_ID }}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', '{{ GA_MEASUREMENT_ID }}');
    </script>
{% endif %}
